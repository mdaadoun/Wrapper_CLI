# Pre-commit configuration for AIPE_Framework

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-added-large-files
        name: Block large files (> 500 KB)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets and API keys
        args: ['--baseline', '.secrets.baseline']
        exclude: poetry.lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.3
    hooks:
      - id: ruff
        name: Ruff Linter (static analysis & fix)
        args: [--fix]
      - id: ruff-format
        name: Ruff Formatter

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        name: Mypy (strict static type check)
        additional_dependencies: [fastapi, pydantic, uvicorn]
        args: [--strict]
        files: ^src/
