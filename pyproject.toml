[tool.poetry]
name = "wrapper-cli"
version = "0.1.0"
description = "Automated, resilient, typed AI watcher CLI tool with FinOps tracking."
authors = ["Michael <michael@example.com>"]
readme = "README.md"
packages = [{include = "ai_watcher", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.6.4"
typer = {extras = ["all"], version = "^0.27.0"}
rich = "^13.7.1"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
tenacity = "^8.2.3"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.14.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
ruff = "^0.3.3"
mypy = "^1.9.0"
pre-commit = "^3.6.2"
detect-secrets = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    '^dashboard/',
    '^tests/',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80
