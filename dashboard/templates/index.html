<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 AIPE_Framework — Dashboard Industriel & Suivi</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #090514;
            --bg-card: rgba(20, 16, 32, 0.7);
            --primary: #8b5cf6;
            --secondary: #a78bfa;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #a7a8bc;
            --border: rgba(255, 255, 255, 0.08);
            --font-outfit: 'Outfit', sans-serif;
            --font-inter: 'Inter', sans-serif;
            --font-fira: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.1) transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 55%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 55%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-inter);
            min-height: 100vh;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
            background: rgba(9, 5, 20, 0.65);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 16px 40px;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-outfit);
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-outfit);
            font-weight: 500;
            font-size: 0.88rem;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 32px auto;
            padding: 0 40px;
        }

        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            padding: 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            min-height: 550px;
            animation: fadeIn 0.45s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Documentation & Markdown */
        .markdown-body h1 {
            color: #ffffff;
            font-size: 1.6rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .markdown-body h2 {
            color: var(--secondary);
            font-size: 1.3rem;
            margin-top: 24px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.15);
            padding-bottom: 6px;
        }

        .markdown-body p {
            margin: 10px 0;
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        /* Interview Grid Layout */
        .interview-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 32px;
            height: 600px;
        }

        .question-list-panel {
            border-right: 1px solid var(--border);
            padding-right: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .question-item {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-outfit);
            font-weight: 500;
            font-size: 0.92rem;
            color: var(--text-muted);
            text-align: left;
        }

        .question-item:hover {
            border-color: rgba(167, 139, 250, 0.4);
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }

        .question-item.active {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.12);
            color: var(--secondary);
            box-shadow: inset 0 0 12px rgba(139, 92, 246, 0.08);
        }

        .workspace-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-left: 10px;
        }

        .workspace-welcome {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 16px;
            opacity: 0.75;
        }

        .workspace-welcome svg {
            color: var(--primary);
            filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.4));
        }

        .question-title {
            font-family: var(--font-outfit);
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            border-left: 4px solid var(--primary);
            padding-left: 14px;
        }

        .answer-input {
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #ffffff;
            font-family: var(--font-inter);
            font-size: 0.95rem;
            padding: 14px;
            resize: none;
            transition: all 0.25s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.15);
        }

        .btn {
            background: var(--primary);
            border: none;
            color: #ffffff;
            font-family: var(--font-outfit);
            font-weight: 600;
            font-size: 0.92rem;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            align-self: flex-start;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
        }

        .btn-reveal {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        }

        .results-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-top: 10px;
            animation: fadeIn 0.3s ease-out;
        }

        .results-header {
            font-family: var(--font-outfit);
            font-weight: 600;
            font-size: 1.02rem;
            color: var(--secondary);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        /* Test Launcher (Terminal look) */
        .terminal {
            background: #05020c;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: var(--font-fira);
            padding: 20px;
            min-height: 400px;
            max-height: 550px;
            overflow-y: auto;
            box-shadow: inset 0 0 16px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .terminal-title {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .terminal-body {
            flex: 1;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #d8b4fe;
            white-space: pre-wrap;
        }

        .terminal-prompt {
            color: var(--success);
        }

        .terminal-output-success {
            color: #34d399;
        }

        .terminal-output-fail {
            color: #f87171;
        }

        .test-launcher-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .test-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
        }

        /* API Docs styling */
        .api-docs-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 24px;
            padding: 60px 20px;
            height: 100%;
        }

        .api-docs-panel h2 {
            font-family: var(--font-outfit);
            font-size: 1.6rem;
            font-weight: 700;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 24px 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            background: rgba(9, 5, 20, 0.4);
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Roadmap CSS */
        .roadmap-container {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .roadmap-header-section {
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 8px;
        }

        .roadmap-main-title {
            font-family: var(--font-outfit);
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .roadmap-main-subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .phase-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            transition: var(--transition);
        }

        .phase-section:hover {
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.015);
        }

        .phase-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .phase-banner.completed {
            background: rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.15);
        }

        .phase-banner.active {
            background: rgba(139, 92, 246, 0.06);
            border-color: rgba(139, 92, 246, 0.18);
        }

        .phase-banner.pending {
            background: rgba(255, 255, 255, 0.02);
            border-color: var(--border);
        }

        .phase-banner-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .phase-index {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .phase-banner.completed .phase-index { color: var(--success); }
        .phase-banner.active .phase-index { color: var(--secondary); }

        .phase-title {
            font-family: var(--font-outfit);
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
        }

        .phase-status-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .phase-status-badge.completed { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: var(--success); }
        .phase-status-badge.active { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); color: var(--secondary); }
        .phase-status-badge.pending { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: var(--text-muted); }

        .phase-objective {
            font-size: 0.88rem;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }

        .step-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
        }

        .step-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.015);
        }

        .step-card.completed { border-color: rgba(16, 185, 129, 0.15); }
        .step-card.active { border-color: rgba(139, 92, 246, 0.25); box-shadow: 0 0 15px rgba(139, 92, 246, 0.05); }

        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .step-number {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .step-card.completed .step-number { color: var(--success); }
        .step-card.active .step-number { color: var(--secondary); }

        .step-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 5px;
        }

        .badge-completed { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-active { background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.15); color: var(--secondary); }
        .badge-pending { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); color: var(--text-muted); }

        .step-title {
            font-family: var(--font-outfit);
            font-size: 0.98rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.35;
        }

        .step-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .detail-item strong {
            color: #e2e8f0;
        }

        .detail-item a {
            color: var(--secondary);
            text-decoration: none;
            border-bottom: 1px dashed var(--secondary);
        }

        .detail-item a:hover {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }

        .detail-item code {
            background: rgba(0, 0, 0, 0.4);
            color: var(--secondary);
            padding: 1px 4px;
            border-radius: 3px;
            font-family: var(--font-fira);
            font-size: 0.78rem;
        }

        .validation-item {
            background: rgba(255,255,255,0.01);
            border-left: 2px solid var(--border);
            padding-left: 8px;
            margin-top: 4px;
        }

        .step-card.completed .validation-item { border-left-color: var(--success); }
        .step-card.active .validation-item { border-left-color: var(--secondary); }

        /* ==========================================================================
           Responsive Design (Mobile & Tablettes)
           ========================================================================== */
        @media (max-width: 1024px) {
            header {
                padding: 16px 20px;
            }
            .header-container {
                flex-direction: column;
                gap: 16px;
                align-items: center;
                text-align: center;
            }
            main {
                padding: 0 20px;
                margin: 20px auto;
            }
            .content-card {
                padding: 24px;
            }
            .interview-grid {
                grid-template-columns: 280px 1fr;
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            header {
                position: static;
                padding: 16px 12px;
            }
            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }
            .tab-btn {
                padding: 8px 12px;
                font-size: 0.8rem;
                flex: 1 1 auto;
                justify-content: center;
            }
            main {
                padding: 0 12px;
                margin: 12px auto;
            }
            .content-card {
                padding: 16px;
                border-radius: 12px;
                min-height: auto;
            }
            .interview-grid {
                grid-template-columns: 1fr;
                height: auto;
                gap: 24px;
            }
            .question-list-panel {
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding-right: 0;
                padding-bottom: 16px;
                max-height: 250px;
            }
            #answer-card {
                max-height: none;
                height: auto;
            }
            .journal-container {
                grid-template-columns: 1fr !important;
                height: auto !important;
                max-height: none !important;
            }
            .sidebar-panel {
                max-height: 250px !important;
            }
            .content-panel {
                max-height: none !important;
            }
            .test-launcher-panel .test-controls {
                flex-direction: column;
                align-items: stretch !important;
                gap: 12px;
            }
            .test-launcher-panel .test-controls select {
                max-width: 100% !important;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-makefile.min.js"></script>

</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>AIPE_Framework</span>
            </div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('presentation')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    <span data-i18n="presentation">Présentation</span>
                </button>
                <button class="tab-btn" onclick="switchTab('roadmap')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                    <span data-i18n="roadmap">Roadmap</span>
                </button>
                <button class="tab-btn" onclick="switchTab('glossaire')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20F4 3.5A2.5 2.5 0 0 1 6.5 1H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>
                    <span data-i18n="glossaire">Glossaire</span>
                </button>
                <button class="tab-btn" onclick="switchTab('journal')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    <span data-i18n="journal">Journal</span>
                </button>
                <button class="tab-btn" onclick="switchTab('entretien')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    <span data-i18n="faq">FAQ (Entretien)</span>
                </button>
                <button class="tab-btn" onclick="switchTab('tests')">

    <script>
        let currentTab = 'presentation';
        let currentLang = 'en';
        let faqQuestions = [];
        let activeQuestionId = null;
        let activeGlossaryId = null;
        let activeJournalId = null;

        function changeLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            document.getElementById('lang-btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('lang-btn-fr').classList.toggle('active', lang === 'fr');

            loadTabContent(currentTab);
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            loadTabContent('presentation');
        });

        function switchTab(tabName) {
            if (currentTab === tabName) return;

            // Set buttons active
            document.querySelectorAll('.nav-tabs .tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            currentTab = tabName;
            loadTabContent(tabName);
        }

        async function loadTabContent(tabName) {
            const container = document.getElementById('main-content');
            container.innerHTML = '<div class="spinner"></div>';

            try {
                if (tabName === 'code') {
                    renderCodeBrowser(container);
                    return;
                }

                if (tabName === 'entretien') {
                    renderInterviewSimulator(container);
                    return;
                }

                if (tabName === 'tests') {
                    renderTestLauncher(container);
                    return;
                }

                if (tabName === 'docs_api') {
                    renderApiDocsPanel(container);
                    return;
                }

                if (tabName === 'journal') {
                    renderJournalNavigator(container);
                    return;
                }

                if (tabName === 'glossaire') {
                    renderGlossaryNavigator(container);
                    return;
                }

                const response = await fetch(`/api/${tabName}?lang=${currentLang}`);
                const data = await response.json();

                if (data.status === 'success') {
                    container.innerHTML = `<div class="markdown-body">${data.html}</div>`;
                } else {
                    container.innerHTML = `<div style="color: #ef4444; padding: 20px;">Erreur : ${data.message}</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="color: #ef4444; padding: 20px;">Erreur de chargement : ${err.message}</div>`;
            }
        }

        async function renderInterviewSimulator(container) {
            container.innerHTML = `
                <div class="interview-grid">
                    <div class="question-list-panel" id="questions-list">
                        <div class="spinner"></div>
                    </div>
                    <div class="workspace-panel" id="workspace-panel" style="padding-left: 10px;">
                        <div class="workspace-welcome">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            <div>
                                <h3 style="font-family: var(--font-outfit); font-size: 1.2rem; font-weight: 600; color: #ffffff; margin-bottom: 6px;">Questions & Réponses (FAQ)</h3>
                                <p style="font-size: 0.9rem;">Sélectionnez une question technique dans le panneau de gauche pour consulter sa réponse structurée.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            try {
                const response = await fetch(`/api/entretien?lang=${currentLang}`);
                const data = await response.json();

                if (data.status === 'success') {
                    faqQuestions = data.questions;
                    const listPanel = document.getElementById('questions-list');
                    listPanel.innerHTML = '';

                    let targetBtn = null;
                    let targetId = activeQuestionId;

                    faqQuestions.forEach((q, idx) => {
                        const btn = document.createElement('button');
                        btn.className = 'question-item';
                        btn.innerHTML = q.question;
                        btn.onclick = () => selectQuestion(q.id, btn);
                        listPanel.appendChild(btn);

                        if (targetId !== null && q.id === targetId) {
                            targetBtn = btn;
                        } else if (idx === 0 && targetBtn === null) {
                            targetBtn = btn;
                            targetId = q.id;
                        }
                    });

                    if (targetBtn) {
                        selectQuestion(targetId, targetBtn);
                    }
                }
            } catch (err) {
                document.getElementById('questions-list').innerHTML = `<div style="color: #ef4444; font-size: 0.85rem;">Erreur : ${err.message}</div>`;
            }
        }

        async function selectQuestion(id, btnElement) {
            document.querySelectorAll('#questions-list .question-item').forEach(item => {
                item.classList.remove('active');
            });
            if (btnElement) btnElement.classList.add('active');

            activeQuestionId = id;
            const q = faqQuestions.find(item => item.id === id);

            const workspace = document.getElementById('workspace-panel');
            workspace.innerHTML = '<div class="spinner"></div>';

            try {
                const response = await fetch(`/api/entretien/${id}?lang=${currentLang}`);
                const data = await response.json();

                if (data.status === 'success') {
                    const titleText = q ? q.question : data.question;
                    workspace.innerHTML = `
                        <div class="question-title" style="margin-bottom: 20px;">${titleText}</div>
                        <div class="results-box" style="margin-top: 0; animation: fadeIn 0.3s ease-out;">
                            <div class="results-header">Explications Techniques & Architecture</div>
                            <div class="markdown-body">${data.answer_html}</div>
                        </div>
                    `;
                }
            } catch (err) {
                workspace.innerHTML = `<div style="color: #ef4444; padding: 20px;">Erreur de chargement : ${err.message}</div>`;
            }
        }

                } else {
                    terminalWindow.style.borderColor = 'var(--danger)';
                    terminal.innerHTML += `<span class="terminal-output-fail">[ERROR] ${data.message}</span>`;

        async function selectCodeFile(path, btnElement) {
            document.querySelectorAll('#code-file-list .question-item').forEach(item => {
                item.classList.remove('active');
            });
            if (btnElement) btnElement.classList.add('active');

            // Dynamic styling of Intro button based on active page selection
            const introBtn = document.getElementById('btn-goto-intro');
            const isIntroPage = path.endsWith('code_en.md') || path.endsWith('code_fr.md');
            if (introBtn) {
                if (isIntroPage) {
                    introBtn.style.background = 'rgba(139, 92, 246, 0.25)';
                    introBtn.style.borderColor = 'rgba(139, 92, 246, 0.5)';
                    introBtn.style.color = '#ffffff';
                    introBtn.style.boxShadow = '0 0 10px rgba(139, 92, 246, 0.2)';
                } else {
                    introBtn.style.background = 'rgba(255, 255, 255, 0.04)';
                    introBtn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                    introBtn.style.color = 'var(--text-muted)';
                    introBtn.style.boxShadow = 'none';
                }
            }

            const filepathEl = document.getElementById('code-filepath');
            const badgeEl = document.getElementById('code-language-badge');
            const codeBlock = document.getElementById('code-block');

            filepathEl.textContent = path;
            codeBlock.textContent = '# Chargement du fichier...';

            let lang = 'python';
            if (path.endsWith('.toml')) lang = 'toml';
            else if (path.endsWith('.yaml') || path.endsWith('.yml')) lang = 'yaml';
            else if (path.endsWith('.json')) lang = 'json';
            else if (path.endsWith('Makefile')) lang = 'makefile';
            else if (path.endsWith('.html')) lang = 'html';
            else if (path.endsWith('.md')) lang = 'markdown';
            else if (path.endsWith('Dockerfile') || path.endsWith('.dockerignore')) lang = 'docker';

            badgeEl.textContent = lang;
            codeBlock.className = `language-${lang}`;

            try {
                const response = await fetch(`/api/code/file?path=${encodeURIComponent(path)}`);
                const data = await response.json();

                const preBlock = document.getElementById('code-pre-block');
                const mdView = document.getElementById('markdown-rendered-view');

                if (data.status === 'success') {
                    if (path.endsWith('.md')) {
                        if (preBlock) preBlock.style.display = 'none';
                        if (mdView) {
                            mdView.style.display = 'block';
                            mdView.innerHTML = renderSimpleMarkdown(data.content);
                        }
                    } else {
                        if (mdView) mdView.style.display = 'none';
                        if (preBlock) preBlock.style.display = 'block';
                        codeBlock.textContent = data.content;
                        if (window.Prism) {
                            Prism.highlightElement(codeBlock);
                        }
                    }
                } else {
                    if (mdView) mdView.style.display = 'none';
                    if (preBlock) preBlock.style.display = 'block';
                    codeBlock.textContent = `# Erreur : ${data.message}`;
                }
            } catch (err) {
                const preBlock = document.getElementById('code-pre-block');
                const mdView = document.getElementById('markdown-rendered-view');
                if (mdView) mdView.style.display = 'none';
                if (preBlock) preBlock.style.display = 'block';
                codeBlock.textContent = `# Erreur de chargement : ${err.message}`;
            }
        }

        function renderSimpleMarkdown(mdText) {
            if (!mdText) return '';
            let lines = mdText.split('\n');
            let out = [];
            let inList = false;
            let inCode = false;
            let codeLines = [];

            lines.forEach(line => {
                let trimmed = line.trim();

                if (trimmed.startsWith('```')) {
                    if (inCode) {
                        inCode = false;
                        out.push(`<pre style="background: rgba(0,0,0,0.5); padding: 12px; border-radius: 6px; color: #d8b4fe; font-family: monospace; font-size: 0.82rem; overflow-x: auto; margin: 10px 0;"><code>${htmlEscape(codeLines.join('\n'))}</code></pre>`);
                        codeLines = [];
                    } else {
                        if (inList) { out.push('</ul>'); inList = false; }
                        inCode = true;
                        codeLines = [];
                    }
                    return;
                }

                if (inCode) {
                    codeLines.push(line);
                    return;
                }

                if (trimmed.startsWith('---') || trimmed.startsWith('***')) {
                    if (inList) { out.push('</ul>'); inList = false; }
                    out.push('<hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 16px 0;">');
                    return;
                }

                if (trimmed.startsWith('# ')) {
                    if (inList) { out.push('</ul>'); inList = false; }
                    out.push(`<h1 style="color: #ffffff; font-size: 1.45rem; font-family: var(--font-outfit); margin-top: 12px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">${htmlEscape(trimmed.substring(2))}</h1>`);
                    return;
                }
                if (trimmed.startsWith('## ')) {
                    if (inList) { out.push('</ul>'); inList = false; }
                    out.push(`<h2 style="color: var(--secondary); font-size: 1.2rem; font-family: var(--font-outfit); margin-top: 18px; margin-bottom: 8px; border-bottom: 1px solid rgba(139, 92, 246, 0.2); padding-bottom: 4px;">${htmlEscape(trimmed.substring(3))}</h2>`);
                    return;
                }
                if (trimmed.startsWith('### ')) {
                    if (inList) { out.push('</ul>'); inList = false; }
                    out.push(`<h3 style="color: #ffffff; font-size: 1.02rem; font-family: var(--font-outfit); margin-top: 14px; margin-bottom: 6px;">${htmlEscape(trimmed.substring(4))}</h3>`);
                    return;
                }

                if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
                    if (!inList) {
                        out.push('<ul style="padding-left: 20px; margin: 8px 0; color: #cbd5e1;">');
                        inList = true;
                    }
                    out.push(`<li style="margin-bottom: 4px;">${htmlEscape(trimmed.substring(2))}</li>`);
                    return;
                } else if (inList) {
                    out.push('</ul>');
                    inList = false;
                }

                if (trimmed) {
                    out.push(`<p style="margin: 6px 0; color: #e2e8f0; line-height: 1.5;">${htmlEscape(trimmed)}</p>`);
                }
            });

            if (inList) out.push('</ul>');

            let htmlContent = out.join('\n');
            htmlContent = htmlContent.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #ffffff;">$1</strong>');
            htmlContent = htmlContent.replace(/`(.*?)`/g, '<code style="background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: #d8b4fe; font-family: monospace; font-size: 0.82rem;">$1</code>');
            htmlContent = htmlContent.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" style="color: var(--secondary); text-decoration: underline;" target="_blank">$1</a>');

            return htmlContent;
        }

        function htmlEscape(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
